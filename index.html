<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>У меня к тебе вопрос 💌</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb, #a6c1ee, #f6d365);
    background-size: 400% 400%;
    animation: bg 15s ease infinite;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  @keyframes bg { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

  .heart {
    position: fixed; bottom: -50px; font-size: 24px; pointer-events: none;
    animation: fly linear forwards; z-index: 0;
  }
  @keyframes fly { to { transform: translateY(-115vh) rotate(360deg); opacity: 0; } }

  .screen {
    display: none; position: relative; z-index: 1;
    background: rgba(255,255,255,0.85); backdrop-filter: blur(10px);
    padding: 40px 30px; border-radius: 30px; text-align: center;
    box-shadow: 0 20px 60px rgba(255, 64, 129, 0.35);
    width: 92%; max-width: 560px; animation: pop .5s ease;
  }
  .screen.active { display: block; }
  @keyframes pop { from { transform: scale(.7); opacity: 0 } to { transform: scale(1); opacity: 1 } }

  h1 { color: #e91e63; font-size: 2rem; margin-bottom: 10px; }
  p.sub { color: #7b1fa2; margin-bottom: 25px; font-size: 1.1rem; }
  .big-emoji { font-size: 70px; margin-bottom: 15px; animation: beat 1.2s infinite; }
  @keyframes beat { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }

  .btn {
    border: none; cursor: pointer; font-size: 1.3rem; font-weight: bold;
    padding: 14px 40px; border-radius: 50px; color: #fff; margin: 10px;
    transition: transform .2s, box-shadow .2s;
  }
  .btn:hover { transform: scale(1.08); }
  #yesBtn { background: linear-gradient(45deg, #ff4081, #f50057); box-shadow: 0 8px 20px rgba(245,0,87,.4); }
  #noBtn  { background: linear-gradient(45deg, #7c4dff, #536dfe); transition: left .25s, top .25s; z-index: 10; }

  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
  .option {
    padding: 22px 10px; border-radius: 20px; cursor: pointer; color: #fff;
    font-size: 1.1rem; font-weight: bold; transition: transform .2s;
    box-shadow: 0 8px 20px rgba(0,0,0,.15);
  }
  .option:hover { transform: translateY(-6px) scale(1.04); }
  .option span { display: block; font-size: 45px; margin-bottom: 8px; }
  .o1 { background: linear-gradient(135deg, #43e97b, #38f9d7); }
  .o2 { background: linear-gradient(135deg, #fa709a, #fee140); }
  .o3 { background: linear-gradient(135deg, #a18cd1, #fbc2eb); }
  .o4 { background: linear-gradient(135deg, #4facfe, #00f2fe); }

  .cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
  .cal-head button {
    background: linear-gradient(45deg,#ff4081,#7c4dff); color:#fff; border:none;
    width: 40px; height: 40px; border-radius: 50%; font-size: 1.2rem; cursor: pointer;
  }
  .cal-head h2 { color: #e91e63; text-transform: capitalize; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .wd { font-weight: bold; color: #7b1fa2; padding: 5px 0; }
  .day {
    padding: 10px 0; border-radius: 12px; cursor: pointer; background: #fff0f6;
    color: #333; font-weight: 600; transition: .2s;
  }
  .day:hover:not(.disabled) { background: #ff80ab; color: #fff; }
  .day.disabled { color: #ccc; background: #f5f5f5; cursor: not-allowed; }
  .day.selected { background: linear-gradient(45deg,#ff4081,#7c4dff); color: #fff; transform: scale(1.1); }
  .day.empty { background: transparent; cursor: default; }

  .time { margin-top: 18px; font-size: 1.1rem; color: #7b1fa2; }
  .time input { padding: 8px 12px; border-radius: 12px; border: 2px solid #ff80ab; font-size: 1rem; }
  #confirmBtn { background: linear-gradient(45deg,#ff4081,#7c4dff); margin-top: 20px; }
  #confirmBtn:disabled { opacity: .5; cursor: not-allowed; }
  #status { margin-top: 15px; color: #7b1fa2; }
</style>
</head>
<body>

<!-- Экран 1: Вопрос -->
<div class="screen active" id="s1">
  <div class="big-emoji">💖</div>
  <h1>Пойдёшь со мной на свидание?</h1>
  <p class="sub">Подумай хорошенько 😉</p>
  <button class="btn" id="yesBtn">Да 😍</button>
  <button class="btn" id="noBtn">Нет 😢</button>
</div>

<!-- Экран 2: Выбор свидания -->
<div class="screen" id="s2">
  <h1>Ура!!! 🥳</h1>
  <p class="sub">Выбери, как мы проведём время:</p>
  <div class="options">
    <div class="option o1" data-v="Пойти гулять 🌳"><span>🌳</span>Пойти гулять</div>
    <div class="option o2" data-v="Пойти в кафе 🍰"><span>🍰</span>Пойти в кафе</div>
    <div class="option o3" data-v="Выпить кофе ☕"><span>☕</span>Выпить кофе</div>
    <div class="option o4" data-v="Покататься на машине 🚗"><span>🚗</span>Покататься на машине</div>
  </div>
</div>

<!-- Экран 3: Календарь -->
<div class="screen" id="s3">
  <h1>Когда тебе удобно? 📅</h1>
  <p class="sub" id="chosenType"></p>
  <div class="cal-head">
    <button id="prev">‹</button>
    <h2 id="monthName"></h2>
    <button id="next">›</button>
  </div>
  <div class="grid" id="calendar"></div>
  <div class="time">Время: <input type="time" id="timeInput" value="18:00"></div>
  <button class="btn" id="confirmBtn" disabled>Подтвердить 💌</button>
  <div id="status"></div>
</div>

<!-- Экран 4: Финал -->
<div class="screen" id="s4">
  <div class="big-emoji">🥰</div>
  <h1>Это свидание!</h1>
  <p class="sub" id="finalText"></p>
  <p class="sub">Я уже жду с нетерпением! 💕</p>
  <button class="btn" id="vkBtn" style="background: linear-gradient(45deg,#0077ff,#4c75a3);">Отправить ответ в VK 💌</button>
  <p class="sub" id="vkHint" style="margin-top:10px;font-size:.95rem;"></p>
</div>

<script>
  const EMAIL = "yaroslavkiselyov@list.ru";
  // ⬇️ ВПИШИТЕ СЮДА своё короткое имя VK (из ссылки vk.com/ИМЯ), например "yaroslav" или "id123456"
  const VK_ID = "yarikxgod";
  let dateType = "", selectedDate = null;

  // Летающие сердечки
  const emojis = ["💖","💕","💘","💝","🌸","✨","💗","🌹"];
  setInterval(() => {
    const h = document.createElement("div");
    h.className = "heart";
    h.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    h.style.left = Math.random() * 100 + "vw";
    h.style.fontSize = 18 + Math.random() * 25 + "px";
    h.style.animationDuration = 5 + Math.random() * 5 + "s";
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 10000);
  }, 400);

  function show(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
  }

  // Убегающая кнопка «Нет»
  const noBtn = document.getElementById("noBtn");
  const noTexts = ["Нет 😢","Точно? 🥺","Подумай ещё 😏","Не получится 😜","Ну пожааалуйста 🙏","Ха, мимо! 😂"];
  let i = 0;
  let origin = null; // центр экрана — центр области движения
  const AREA = 800;  // размер области движения (px)
  function runAway(e) {
    if (e) e.preventDefault();

    const rect = noBtn.getBoundingClientRect();
    // Центр области перемещения — центр экрана
    origin = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    const minJump = 60;   // минимальный отскок (px)
    const maxJump = 90;  // максимальный отскок (px): чем меньше, тем ближе убегает

    // Случайное направление и расстояние
    const angle = Math.random() * Math.PI * 2;
    const dist = minJump + Math.random() * (maxJump - minJump);

    let newX = rect.left + Math.cos(angle) * dist;
    let newY = rect.top + Math.sin(angle) * dist;

    // Не даём кнопке уйти за край экрана
    const pad = 10;
    const maxX = window.innerWidth - noBtn.offsetWidth - pad;
    const maxY = window.innerHeight - noBtn.offsetHeight - pad;
    // Ограничение областью AREA×AREA вокруг центра экрана
    const half = AREA / 2;
    const areaMinX = origin.x - half, areaMaxX = origin.x + half - noBtn.offsetWidth;
    const areaMinY = origin.y - half, areaMaxY = origin.y + half - noBtn.offsetHeight;
    newX = Math.min(Math.max(areaMinX, newX), areaMaxX);
    newY = Math.min(Math.max(areaMinY, newY), areaMaxY);

    // И не даём уйти за край экрана
    newX = Math.min(Math.max(pad, newX), maxX);
    newY = Math.min(Math.max(pad, newY), maxY);

    if (noBtn.style.position !== "fixed") {
      // Первое наведение: фиксируем кнопку на текущем месте без анимации,
      // чтобы она не улетала из угла экрана
      const placeholder = document.createElement("span");
      placeholder.style.display = "inline-block";
      placeholder.style.width = (rect.width + 20) + "px";
      placeholder.style.height = rect.height + "px";
      noBtn.after(placeholder);
      // Переносим кнопку в body: у карточки есть backdrop-filter,
      // из-за которого position:fixed считается от карточки, а не от экрана
      document.body.appendChild(noBtn);
      noBtn.style.transition = "none";
      noBtn.style.margin = "0";
      noBtn.style.position = "fixed";
      noBtn.style.left = rect.left + "px";
      noBtn.style.top = rect.top + "px";
      noBtn.offsetHeight; // применить положение
      noBtn.style.transition = "left .25s, top .25s";
      // Первый прыжок — ровно в центр экрана
      newX = origin.x - noBtn.offsetWidth / 2;
      newY = origin.y - noBtn.offsetHeight / 2;
    }
    noBtn.style.left = newX + "px";
    noBtn.style.top = newY + "px";
    noBtn.textContent = noTexts[++i % noTexts.length];
  }
  noBtn.addEventListener("mouseenter", runAway);
  noBtn.addEventListener("touchstart", runAway);
  noBtn.addEventListener("click", runAway);

  document.getElementById("yesBtn").onclick = () => {
    noBtn.style.display = "none";
    show("s2");
  };

  // Выбор типа свидания
  document.querySelectorAll(".option").forEach(o => {
    o.onclick = () => {
      dateType = o.dataset.v;
      document.getElementById("chosenType").textContent = "Ты выбрала: " + dateType;
      show("s3");
      renderCalendar();
    };
  });

  // Календарь
  const today = new Date(); today.setHours(0,0,0,0);
  let viewYear = today.getFullYear(), viewMonth = today.getMonth();

  function renderCalendar() {
    const cal = document.getElementById("calendar");
    cal.innerHTML = "";
    ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].forEach(d => {
      cal.innerHTML += `<div class="wd">${d}</div>`;
    });
    const first = new Date(viewYear, viewMonth, 1);
    document.getElementById("monthName").textContent =
      first.toLocaleDateString("ru-RU", { month: "long", year: "numeric" });

    const offset = (first.getDay() + 6) % 7;
    for (let k = 0; k < offset; k++) cal.innerHTML += `<div class="day empty"></div>`;

    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    for (let d = 1; d <= daysInMonth; d++) {
      const date = new Date(viewYear, viewMonth, d);
      const el = document.createElement("div");
      el.className = "day";
      el.textContent = d;
      if (date < today) el.classList.add("disabled");
      else {
        if (selectedDate && date.getTime() === selectedDate.getTime()) el.classList.add("selected");
        el.onclick = () => {
          selectedDate = date;
          document.getElementById("confirmBtn").disabled = false;
          renderCalendar();
        };
      }
      cal.appendChild(el);
    }
    document.getElementById("prev").disabled =
      viewYear === today.getFullYear() && viewMonth === today.getMonth();
  }
  document.getElementById("prev").onclick = () => {
    if (viewYear === today.getFullYear() && viewMonth === today.getMonth()) return;
    viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; } renderCalendar();
  };
  document.getElementById("next").onclick = () => {
    viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; } renderCalendar();
  };

  // Отправка на почту
  document.getElementById("confirmBtn").onclick = async () => {
    const btn = document.getElementById("confirmBtn");
    const status = document.getElementById("status");
    const dateStr = selectedDate.toLocaleDateString("ru-RU", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    const time = document.getElementById("timeInput").value;

    btn.disabled = true;
    status.textContent = "Отправляю... 💌";

    try {
      await fetch(`https://formsubmit.co/ajax/${EMAIL}`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({
          _subject: "💖 Она согласилась на свидание!",
          _template: "table",
          "Ответ": "ДА 😍",
          "Тип свидания": dateType,
          "Дата": dateStr,
          "Время": time
        })
      });
    } catch (e) { console.log(e); }

    document.getElementById("finalText").innerHTML =
      `${dateType}<br>📅 ${dateStr}<br>⏰ ${time}`;
    show("s4");

    // Сообщение для VK
    const vkMessage = `💖 Я согласна на свидание! ${dateType}, ${dateStr}, в ${time}`;
    const vkUrl = `https://vk.me/${VK_ID}`;

    async function sendToVK() {
      // Копируем готовый текст, чтобы его осталось только вставить
      try { await navigator.clipboard.writeText(vkMessage); } catch (e) {}
      document.getElementById("vkHint").innerHTML =
        "Текст ответа скопирован 📋<br>Просто вставь его в чат и нажми «Отправить» 💕";
      window.open(vkUrl, "_blank");
    }
    document.getElementById("vkBtn").onclick = sendToVK;

    // Сразу пробуем открыть переписку автоматически
    setTimeout(sendToVK, 1500);
  };
</script>
</body>
</html>
